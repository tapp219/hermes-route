    <meta name="referrer" content="no-referrer" />
    <title>Hermes Route</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sets the theme before first paint to avoid a flash. Mirrors src/hooks/useTheme.ts -->
    <script>
      (function () {
        var theme = "light";
        try {
          var s = localStorage.getItem("hermes-route-theme");
          if (s === "light" || s === "dark") theme = s;
          else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
