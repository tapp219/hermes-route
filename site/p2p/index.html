<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2P Chat</title>
</head>
<body>
  <p>Invite link:<br>
     <input id="link" size="60" readonly>
     <button id="copy">Copy</button></p>
  <p id="status">Connecting to server...</p>
  <p><input id="msg" placeholder="Message" maxlength="2000" autocomplete="off">
     <button id="send" disabled>Send</button></p>
  <pre id="log"></pre>
  <p><a href="/p2p/">Start a new chat</a></p>
  <pre id="diag"></pre>
  <script src="/p2p/script.js" defer></script>
</body>
</html>
