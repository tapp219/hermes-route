<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#c7fff8">
    <title>Hermes Route</title>
    <link rel="stylesheet" href="/p2p/styles.css">
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
        <header class="top-bar">
          <h1><a href="/"><img class="brand" src="/assets/site-colors/hermes-route-lockup.svg" alt="Hermes Route" width="1270" height="246"></a></h1>
          <div class="top-buttons">
            <button class="rename-button">Rename</button>
            <a class="new-chat-link" href="/p2p/">New chat</a>
          </div>
        </header>
        <div class="columns">
          <aside class="invite-container">
            <button id="qr" class="qr-code" type="button" aria-label="QR code of the invite link. Press to make it bigger."></button>
            <div class="invite-details">
              <p class="invite-title">Scan to join</p>
              <label for="link" class="invite-label">Or send the invite link. It contains a secret, so share it privately.</label>
              <div class="invite-row">
                <input id="link" class="invite-link" readonly>
                <button id="copy" class="copy-button">Copy</button>
              </div>
              <p class="invite-joined">You are both here. This link now only works in your two browsers.</p>
            </div>
          </aside>
          <div class="chat-column">
            <p id="status" class="status-line">Starting...</p>
            <p id="alert" class="alert-box" hidden></p>
            <div class="first-textbox"><p class="typing-row" hidden></p></div>
            <div class="input-container">
              <textarea class="second-textbox" placeholder="Enter a chat..." maxlength="2000"></textarea>
              <input id="file" type="file" multiple hidden>
              <button class="attach-button" type="button" disabled>Attach</button>
              <button class="send-button" disabled>Send</button>
            </div>
          </div>
        </div>
    </main>
    <!-- The QR code at full size, opened by pressing the small one -->
    <dialog id="qr-big" class="qr-dialog" aria-label="QR code of the invite link">
      <div class="qr-code qr-big-code"></div>
      <p class="qr-big-hint"></p>
    </dialog>
    <!-- A picture from the chat at full size, opened by pressing it -->
    <dialog id="viewer" class="viewer-dialog" aria-label="Picture at full size">
      <img class="viewer-picture" alt="">
      <p class="viewer-caption"><span class="viewer-name"></span><a class="download-button viewer-download">Download</a></p>
      <p class="viewer-hint">Press anywhere to close.</p>
    </dialog>
    <script src="/p2p/vendor/qrcode.js" defer></script>
    <script src="/p2p/script.js" defer></script>
  </body>
</html>
