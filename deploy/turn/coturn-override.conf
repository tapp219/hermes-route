# Installed by deploy/update.sh as /etc/systemd/system/coturn.service.d/hermes-route.conf
[Service]
# Rebuild the config before every start, so the addresses are always current.
# The leading + runs this one command as root; the relay itself still runs unprivileged.
ExecStartPre=+/srv/hermes-route/deploy/turn/write-config.sh
Restart=on-failure
RestartSec=5
